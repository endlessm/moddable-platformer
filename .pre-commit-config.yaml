repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
- repo: https://github.com/Scony/godot-gdscript-toolkit
  rev: 4.5.0
  hooks:
  - id: gdlint
  - id: gdformat
exclude: |
  (?x)^(
    addons/(.*)
  )$
